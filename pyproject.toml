[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "project-sentinel"
version = "1.0.0"
description = "Four-layer fraud detection for last-mile delivery"
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Project Sentinel contributors"}]
dependencies = [
  "pandas>=2.2,<3",
  "numpy>=1.26,<3",
  "duckdb>=1.0,<2",
  "pyarrow>=16,<20",
  "scikit-learn>=1.5,<2",
  "xgboost>=2.0,<4",
  "shap>=0.45,<1",
  "networkx>=3.3,<4",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "requests>=2.32,<3",
  "tenacity>=8.5,<10",
  "joblib>=1.4,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.6,<1", "mypy>=1.11,<2",
  "types-requests>=2.32,<3", "bandit>=1.7,<2", "pip-audit>=2.7,<3",
]
viz = ["jupyter>=1.0,<2", "matplotlib>=3.9,<4", "seaborn>=0.13,<1"]
api = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "httpx>=0.27,<1"]

[project.scripts]
sentinel = "sentinel.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=sentinel --cov-report=term-missing --cov-report=xml --cov-fail-under=75"
pythonpath = ["."]
tmp_path_retention_policy = "failed"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "RUF"]
ignore = ["E501", "W291", "B905", "RUF007"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
warn_return_any = true
exclude = ["notebooks"]

[[tool.mypy.overrides]]
module = [
  "xgboost.*", "shap.*", "duckdb.*", "networkx.*", "pandas.*",
  "sklearn.*", "joblib.*", "fastapi.*",
]
ignore_missing_imports = true
