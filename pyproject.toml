[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "project-sentinel"
version = "1.0.0"
description = "Four-layer fraud detection for last-mile delivery"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "dev00amk" }]
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    "duckdb>=1.0,<2",
    "pyarrow>=23.0.1,<24",
    "scikit-learn>=1.5,<2",
    "xgboost>=2.0,<4",
    "shap>=0.45,<1",
    "networkx>=3.3,<4",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "requests>=2.32,<3",
    "tenacity>=8.5,<10",
    "joblib>=1.4,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.6,<1",
    "mypy>=1.11,<2",
    "types-requests>=2.32,<3",
    "bandit>=1.7,<2",
    "pip-audit>=2.7,<3",
]
viz = [
    "matplotlib>=3.9,<4",
    "seaborn>=0.13,<1",
    "jupyter>=1.0,<2",
]
api = [
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.30,<1",
]

[project.scripts]
sentinel = "sentinel.cli:main"

[tool.setuptools.packages.find]
include = ["sentinel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=sentinel --cov-report=term-missing --cov-fail-under=75"
tmp_path_retention_policy = "failed"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "N", "UP", "SIM", "C4", "RUF"]

[tool.ruff.lint.per-file-ignores]
# IEEE-CIS columns (TransactionAmt, C1, V258...) force non-snake_case names.
"sentinel/schema.py" = ["N815"]
# X (sklearn design-matrix convention) and G (networkx graph convention).
"sentinel/model.py" = ["N806"]
"sentinel/graph.py" = ["N806"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
exclude = ["notebooks"]

[[tool.mypy.overrides]]
module = "sentinel.*"
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "duckdb.*",
    "networkx.*",
    "pandas.*",
    "requests.*",
    "shap.*",
    "sklearn.*",
    "tenacity.*",
    "xgboost.*",
]
ignore_missing_imports = true
