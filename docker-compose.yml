services:
  sentinel-api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data/models:/app/data/models:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
