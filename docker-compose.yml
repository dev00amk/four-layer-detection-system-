services:
  sentinel-api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      # Train locally first: python run.py full  (or: sentinel train)
      - ./data/models:/app/data/models:ro
    environment:
      LOG_LEVEL: INFO
      OSINT_MODE: sim
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 3s
      start_period: 15s
      retries: 3
