name: Model Governance

on:
  push:
    paths:
      - 'sentinel/model.py'
      - 'sentinel/anomaly.py'
      - 'sentinel/graph.py'
      - 'sentinel/signals.py'
      - 'sql/signals/**'
      - 'requirements.txt'
  schedule:
    # Weekly governance run every Monday at 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual trigger (e.g. post-incident review)'
        required: false
        default: 'Manual governance run'

jobs:
  model-evaluation:
    name: Model Quality & Governance Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate synthetic demo data
        run: python -m sentinel.demo

      - name: Run ingestion and enrichment
        run: |
          python -m sentinel.ingest
          python -m sentinel.enrich

      - name: Run full scoring pipeline
        run: python run.py score

      - name: Evaluate model metrics
        id: metrics
        run: |
          python - <<'EOF'
          import json, sys
          from pathlib import Path

          metrics_file = Path('data/models/metrics.json')
          if not metrics_file.exists():
              print('ERROR: metrics.json not found')
              sys.exit(1)

          m = json.loads(metrics_file.read_text())
          roc = m.get('auc_roc', 0)
          pr  = m.get('auc_pr', 0)

          print(f'AUC-ROC:  {roc:.4f}  (threshold: 0.80)')
          print(f'AUC-PR:   {pr:.4f}  (threshold: 0.70)')
          print(f'Fraud rate: {m.get("fraud_rate", 0):.4f}')
          print(f'Rows scored: {m.get("rows", 0)}')

          failures = []
          if roc < 0.80:
              failures.append(f'AUC-ROC {roc:.4f} < 0.80 governance threshold')
          if pr < 0.70:
              failures.append(f'AUC-PR {pr:.4f} < 0.70 governance threshold')

          if failures:
              print()
              print('GOVERNANCE FAILURES DETECTED:')
              for f in failures:
                  print(f'  - {f}')
              print()
              print('Required action: escalate to model owner before next production run.')
              sys.exit(1)
          else:
              print()
              print('All model governance thresholds passed.')
          EOF

      - name: Run drift check
        run: |
          python - <<'EOF'
          import json
          from pathlib import Path
          from sentinel.drift import check_drift

          metrics_file = Path('data/models/metrics.json')
          if not metrics_file.exists():
              print('No metrics file for drift check — skipping')
              exit(0)

          # Reload scored output for drift check
          import sys
          try:
              import duckdb
              gold = Path('data/gold/scored_trips.parquet')
              if gold.exists():
                  con = duckdb.connect()
                  try:
                      scores_raw = con.execute(
                          "SELECT score FROM read_parquet(?) WHERE score IS NOT NULL LIMIT 5000",
                          [str(gold)],
                      ).fetchall()
                      scores = [r[0] for r in scores_raw]
                  except Exception:
                      scores = []
              else:
                  scores = []
          except Exception as e:
              print(f'Drift check skipped: {e}')
              exit(0)

          if len(scores) < 10:
              print('Insufficient scored records for drift check in demo run — skipping')
              exit(0)

          result = check_drift(scores)
          print(f'Drift PSI: {result["psi"]:.4f}  status: {result["psi_status"]}')
          print(f'Recommended: {result["recommended_action"]}')
          EOF

      - name: Run fairness check
        run: |
          python - <<'EOF'
          import json
          from pathlib import Path

          # In CI with synthetic data, fairness columns may not exist.
          # We run a structural smoke-test to confirm the module imports and
          # executes without error, rather than asserting on synthetic results.
          from sentinel.fairness import check_fairness
          import random
          random.seed(42)

          groups = ['older_android', 'newer_android', 'ios']
          geos = ['north', 'south', 'east', 'west']
          records = [
              {'device_tier': random.choice(groups),
               'geography': random.choice(geos),
               'is_critical': random.random() < 0.15}
              for _ in range(200)
          ]
          report = check_fairness(records)
          status = 'PASS' if not report['any_failures'] else 'FAIL (synthetic data)'
          print(f'Fairness smoke-test: {status}')
          print(f'Overall adverse rate: {report["overall_rate"]:.1%}')
          # Do not fail CI on synthetic data fairness results
          EOF

      - name: Upload governance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governance-run-${{ github.run_number }}
          path: |
            data/models/metrics.json
            data/drift/
            data/fairness/
          retention-days: 90

      - name: Post summary
        if: always()
        run: |
          python - <<'EOF'
          import json
          from pathlib import Path
          m_file = Path('data/models/metrics.json')
          if m_file.exists():
              m = json.loads(m_file.read_text())
              summary = f'''## Model Governance Run Summary
          | Metric | Value |
          |--------|-------|
          | AUC-ROC | {m.get("auc_roc", "N/A")} |
          | AUC-PR | {m.get("auc_pr", "N/A")} |
          | Fraud rate | {m.get("fraud_rate", "N/A")} |
          | Rows scored | {m.get("rows", "N/A")} |
          '''
              import os
              step_summary = os.environ.get('GITHUB_STEP_SUMMARY', '')
              if step_summary:
                  with open(step_summary, 'a') as f:
                      f.write(summary)
              else:
                  print(summary)
          EOF
