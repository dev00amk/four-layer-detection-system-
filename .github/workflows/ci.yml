name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pytest
      - run: python -m sentinel.demo --rows 3000
      - run: python -m sentinel.ingest
      - run: python -m sentinel.enrich
      - run: python run.py

